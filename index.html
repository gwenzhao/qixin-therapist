/* ============================================================
   栖心 V2 — 一条线
   Prototype: 看见 → 溯源
   Process leads. AI follows. One thread carries through.
   ============================================================ */

:root{
  --ink:#22302a;
  --ink-soft:#54645c;
  --ink-faint:#839189;
  --forest:#1b2a23;
  --forest-2:#24372d;
  --paper:#f3eee4;
  --paper-2:#faf7f0;
  --paper-3:#fffdf8;
  --sage:#7d9788;
  --sage-soft:#dfe8df;
  --sage-pale:#edf2ec;
  --clay:#b56e51;
  --clay-soft:#efddd3;
  --gold:#ad8553;
  --gold-soft:#ece0cc;
  --line:rgba(34,48,42,.13);
  --line-soft:rgba(34,48,42,.075);
  --shadow:0 28px 80px rgba(35,44,36,.11);
  --shadow-soft:0 12px 36px rgba(35,44,36,.06);
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --mono:"Cascadia Code","SFMono-Regular",Consolas,monospace;
  --ease:cubic-bezier(.22,.68,.32,1);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100dvh;
  color:var(--ink);
  background:var(--paper);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
a{color:inherit}
::selection{background:var(--gold-soft);color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
svg{display:block}
[hidden]{display:none !important}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:9999;
  pointer-events:none;
  opacity:.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode:multiply;
}

/* ============================================================
   Frame
   ============================================================ */
.app{
  display:grid;
  grid-template-columns:282px minmax(0,1fr);
  height:100dvh;
  overflow:hidden;
}

/* ============================================================
   Sidebar
   ============================================================ */
.sidebar{
  position:relative;
  display:flex;
  flex-direction:column;
  min-height:0;
  padding:28px 21px 19px;
  color:#eae4d7;
  background:
    radial-gradient(120% 55% at 8% 0%,rgba(173,133,83,.17),transparent 62%),
    radial-gradient(90% 55% at 105% 92%,rgba(125,151,136,.14),transparent 60%),
    linear-gradient(165deg,#203229 0%,#19271f 58%,#15211b 100%);
  overflow:hidden;
}
.sidebar::before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.13;
  pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg width='130' height='130' viewBox='0 0 130 130' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23d8c6a2' stroke-opacity='.22'%3E%3Cpath d='M-20 65 Q25 20 65 65 T150 65'/%3E%3Cpath d='M-20 92 Q25 47 65 92 T150 92'/%3E%3C/g%3E%3C/svg%3E");
  background-size:270px 270px;
}
.sidebar::after{
  content:"";
  position:absolute;
  right:-85px;
  top:25%;
  width:190px;
  height:190px;
  border:1px solid rgba(233,222,201,.10);
  border-radius:50%;
  box-shadow:0 0 0 34px rgba(233,222,201,.025),0 0 0 70px rgba(233,222,201,.016);
  pointer-events:none;
}
.sidebar > *{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px;padding:0 5px}
.brand-mark{
  position:relative;
  display:grid;
  place-items:center;
  width:45px;height:45px;
  flex:none;
  border:1px solid rgba(233,222,201,.32);
  border-radius:50%;
  color:#f4ecdc;
  font-family:var(--serif);
  font-size:21px;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.13),transparent 58%);
}
.brand-mark::after{
  content:"";
  position:absolute;
  top:3px;right:4px;
  width:5px;height:5px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 12px rgba(173,133,83,.75);
}
.brand-name{
  font-family:var(--serif);
  font-size:22px;
  letter-spacing:.22em;
  line-height:1.2;
  color:#f5eedf;
}
.brand-sub{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:4px;
  color:rgba(233,226,211,.48);
  font-size:8.5px;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.brand-sub i{
  width:3px;height:3px;
  border-radius:50%;
  background:var(--gold);
  opacity:.8;
  font-style:normal;
}
.date-line{
  display:flex;
  align-items:center;
  gap:7px;
  margin:24px 6px 0;
  color:rgba(233,226,211,.49);
  font-size:10.5px;
  letter-spacing:.05em;
}
.date-line .dot{width:3px;height:3px;border-radius:50%;background:rgba(233,226,211,.3)}
.side-label{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:29px 7px 10px;
  color:rgba(233,226,211,.42);
  font-size:9.5px;
  letter-spacing:.17em;
}
.side-label span:last-child{font-family:var(--mono);letter-spacing:.05em;color:rgba(233,226,211,.35)}
.journey{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:3px;
  margin:0 -4px;
  padding:0 4px;
}
.journey::before{
  content:"";
  position:absolute;
  left:31px;
  top:26px;
  bottom:26px;
  width:1px;
  background:linear-gradient(to bottom,rgba(233,226,211,.17),rgba(233,226,211,.04));
}
.stage-link{
  position:relative;
  display:grid;
  grid-template-columns:31px minmax(0,1fr) 18px;
  align-items:center;
  gap:10px;
  width:100%;
  min-height:58px;
  padding:7px 9px;
  border:0;
  border-radius:13px;
  color:rgba(239,234,222,.53);
  background:transparent;
  text-align:left;
  transition:.25s var(--ease);
}
.stage-link:hover{background:rgba(245,239,227,.055);color:rgba(245,240,230,.88)}
.stage-link.active{
  color:#fbf6ea;
  background:linear-gradient(90deg,rgba(245,239,227,.10),rgba(245,239,227,.035));
  box-shadow:inset 0 0 0 1px rgba(245,239,227,.07);
}
.stage-link.active::before{
  content:"";
  position:absolute;
  left:0;
  top:16px;
  bottom:16px;
  width:2px;
  border-radius:4px;
  background:var(--gold);
  box-shadow:0 0 14px rgba(173,133,83,.5);
}
.stage-num{
  position:relative;
  z-index:1;
  display:grid;
  place-items:center;
  width:24px;height:24px;
  margin-left:2px;
  border:1px solid rgba(233,226,211,.18);
  border-radius:50%;
  color:rgba(239,234,222,.55);
  background:#1b2821;
  font-family:var(--mono);
  font-size:8.5px;
  transition:.25s;
}
.stage-link.active .stage-num{
  border-color:rgba(173,133,83,.72);
  color:#f5e9d2;
  background:#2a3a30;
  box-shadow:0 0 0 4px rgba(173,133,83,.08);
}
.stage-link.done .stage-num{
  border-color:rgba(125,151,136,.62);
  color:#dce8df;
  background:#2a3a31;
}
.stage-copy{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.stage-copy b{
  font-family:var(--serif);
  font-size:16.5px;
  font-weight:400;
  letter-spacing:.16em;
}
.stage-copy small{
  margin-top:5px;
  overflow:hidden;
  color:rgba(233,226,211,.32);
  font-size:9.5px;
  letter-spacing:.04em;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.stage-link.active .stage-copy small{color:rgba(233,226,211,.55)}
.stage-state{display:grid;place-items:center;color:rgba(233,226,211,.28)}
.stage-state svg{width:11px;height:11px;opacity:0;transform:scale(.6);transition:.25s}
.stage-link.done .stage-state svg{opacity:1;transform:scale(1);color:#b9cbbd}
.stage-link.active:not(.done) .stage-state::after{
  content:"";
  width:4px;height:4px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 9px rgba(173,133,83,.8);
}
.stage-link.locked{opacity:.38;cursor:pointer}
.stage-link.locked:hover{background:transparent;color:rgba(239,234,222,.53)}
.stage-link.locked .stage-copy small{color:rgba(233,226,211,.22)}
.stage-link.locked .stage-state{font-size:8px;font-family:var(--mono);color:rgba(233,226,211,.25)}

.side-thread{
  margin:23px 5px 0;
  padding:14px 13px 13px;
  border:1px solid rgba(233,226,211,.10);
  border-radius:14px;
  background:linear-gradient(140deg,rgba(245,239,227,.055),rgba(245,239,227,.018));
}
.side-thread-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  color:rgba(233,226,211,.44);
  font-size:9px;
  letter-spacing:.15em;
}
.side-thread-head span:last-child{color:var(--gold);font-family:var(--mono);font-size:8px}
.side-thread-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:6px 0}
.side-thread-row + .side-thread-row{border-top:1px solid rgba(233,226,211,.07)}
.side-thread-row dt{margin:0;color:rgba(233,226,211,.34);font-size:9px;letter-spacing:.07em}
.side-thread-row dd{margin:0;overflow:hidden;color:rgba(239,232,218,.67);font-family:var(--serif);font-size:11px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.side-thread-row dd.empty{color:rgba(233,226,211,.22);font-family:var(--sans);font-size:9.5px}
.sidebar-foot{margin-top:auto;padding:18px 6px 0}
.side-link{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  padding:8px 2px;
  border:0;
  color:rgba(239,233,221,.53);
  background:transparent;
  font-size:10.5px;
  letter-spacing:.03em;
  text-align:left;
}
.side-link:hover{color:#f5eddf}
.side-link svg{width:13px;height:13px;flex:none;opacity:.8}
.privacy-note{
  display:flex;
  align-items:flex-start;
  gap:6px;
  margin-top:9px;
  padding-top:12px;
  border-top:1px solid rgba(233,226,211,.07);
  color:rgba(233,226,211,.27);
  font-size:9px;
  line-height:1.55;
}
.privacy-note svg{width:10px;height:10px;margin-top:3px;flex:none}

/* ============================================================
   Main
   ============================================================ */
.main{
  position:relative;
  display:grid;
  grid-template-rows:auto auto minmax(0,1fr);
  min-width:0;
  min-height:0;
  overflow:hidden;
  background:
    radial-gradient(60% 45% at 96% 0%,rgba(231,213,187,.38),transparent 70%),
    radial-gradient(42% 55% at 0% 92%,rgba(203,217,205,.34),transparent 74%),
    var(--paper);
}
.main::before{
  content:"";
  position:absolute;
  top:-150px;right:-100px;
  width:420px;height:420px;
  border:1px solid rgba(173,133,83,.14);
  border-radius:50%;
  box-shadow:0 0 0 50px rgba(173,133,83,.022),0 0 0 100px rgba(173,133,83,.014);
  pointer-events:none;
}
.topbar{
  position:relative;
  z-index:3;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:21px 38px 0;
}
.breadcrumb{display:flex;align-items:center;gap:9px;color:var(--ink-faint);font-size:9px;letter-spacing:.16em}
.breadcrumb b{color:var(--ink-soft);font-family:var(--mono);font-weight:400;letter-spacing:.08em}
.breadcrumb .slash{color:rgba(34,48,42,.25)}
.breadcrumb .proto-pill{
  padding:3px 7px;
  border:1px solid rgba(173,133,83,.28);
  border-radius:999px;
  color:#8a6a43;
  background:rgba(236,224,204,.36);
  font-size:7.5px;
  letter-spacing:.12em;
}
.top-actions{display:flex;align-items:center;gap:7px}
.ghost-btn,.icon-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--ink-soft);
  background:rgba(255,253,248,.44);
  transition:.2s var(--ease);
}
.ghost-btn{padding:8px 14px;font-size:10.5px;letter-spacing:.04em}
.ghost-btn:hover,.icon-btn:hover{background:var(--paper-3);border-color:rgba(34,48,42,.22);color:var(--ink);transform:translateY(-1px)}
.icon-btn{width:33px;height:33px;padding:0}
.icon-btn svg{width:14px;height:14px}
.support-btn{color:#8b5c47;border-color:rgba(181,110,81,.25);background:rgba(239,221,211,.22)}

/* thread bar */
.thread-bar{
  position:relative;
  z-index:2;
  margin:17px 38px 0;
  border:1px solid rgba(34,48,42,.11);
  border-radius:16px;
  background:linear-gradient(120deg,rgba(255,253,248,.66),rgba(255,253,248,.34));
  box-shadow:0 3px 16px rgba(34,48,42,.025);
  backdrop-filter:blur(12px);
  overflow:hidden;
}
.thread-bar-main{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:44px;
  padding:0 12px 0 15px;
}
.thread-emblem{
  position:relative;
  width:17px;height:17px;
  flex:none;
  border:1px solid rgba(173,133,83,.46);
  border-radius:50%;
}
.thread-emblem::after{
  content:"";
  position:absolute;
  inset:4px;
  border-radius:50%;
  background:var(--gold);
  opacity:.72;
}
.thread-title{
  flex:none;
  color:#8a6a43;
  font-size:9px;
  letter-spacing:.16em;
}
.thread-preview{
  flex:1;
  min-width:0;
  overflow:hidden;
  color:var(--ink-soft);
  font-family:var(--serif);
  font-size:11.5px;
  letter-spacing:.02em;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.thread-preview.empty{color:var(--ink-faint);font-family:var(--sans);font-size:10px}
.thread-toggle{
  flex:none;
  padding:5px 8px;
  border:1px solid transparent;
  border-radius:999px;
  color:var(--ink-faint);
  background:transparent;
  font-size:8.5px;
}
.thread-toggle:hover{color:var(--ink);background:var(--paper-3);border-color:var(--line-soft)}
.thread-panel{
  display:block;
  max-height:310px;
  padding:4px 15px 12px;
  border-top:1px solid var(--line-soft);
  overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:rgba(34,48,42,.14) transparent;
}
.thread-panel-row{
  display:grid;
  grid-template-columns:54px minmax(0,1fr);
  gap:13px;
  padding:9px 0;
}
.thread-panel-row + .thread-panel-row{border-top:1px dashed var(--line-soft)}
.thread-panel-row dt{margin:0;color:var(--gold);font-size:8.5px;letter-spacing:.12em;line-height:1.8}
.thread-panel-row dd{margin:0;color:var(--ink-soft);font-size:11px;line-height:1.75;white-space:pre-wrap}
.thread-panel-row dd.empty{color:var(--ink-faint);font-size:10px}

/* page */
.page{
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  gap:28px;
  min-height:0;
  padding:0 38px 34px;
}
.stage-main{
  min-width:0;
  min-height:0;
  overflow-y:auto;
  padding:24px 4px 50px 0;
  scrollbar-width:thin;
  scrollbar-color:rgba(34,48,42,.16) transparent;
  animation:fadeUp .5s var(--ease) both;
}
.stage-main::-webkit-scrollbar,.companion-scroll::-webkit-scrollbar,.modal-body::-webkit-scrollbar{width:5px;height:5px}
.stage-main::-webkit-scrollbar-thumb,.companion-scroll::-webkit-scrollbar-thumb,.modal-body::-webkit-scrollbar-thumb{background:rgba(34,48,42,.13);border-radius:8px}
.stage-main::-webkit-scrollbar-track,.companion-scroll::-webkit-scrollbar-track,.modal-body::-webkit-scrollbar-track{background:transparent}

/* stage head */
.stage-head{max-width:680px;margin-bottom:18px;animation:fadeUp .55s var(--ease) both}
.stage-eyebrow{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:7px;
  color:var(--gold);
  font-family:var(--mono);
  font-size:8.5px;
  letter-spacing:.2em;
}
.stage-eyebrow::before{content:"";width:22px;height:1px;background:var(--gold);opacity:.6}
.stage-head h1{
  margin:0;
  font-family:var(--serif);
  font-size:clamp(40px,3.7vw,55px);
  font-weight:400;
  line-height:1.1;
  letter-spacing:.12em;
}
.stage-head h1 em{font-style:normal;color:var(--clay)}
.stage-head p{
  max-width:590px;
  margin:9px 0 0;
  color:var(--ink-soft);
  font-family:var(--serif);
  font-size:14px;
  line-height:1.8;
}
.stage-head p span{display:block;color:var(--ink-faint);font-family:var(--sans);font-size:10.5px;line-height:1.7}
.stage-scope{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  color:var(--ink-faint);
  font-size:9px;
  letter-spacing:.04em;
}
.stage-scope::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--sage)}
.case-link{
  margin-left:8px;
  padding:2px 8px;
  border:1px solid rgba(34,48,42,.13);
  border-radius:999px;
  color:#7e8b83;
  background:rgba(255,253,248,.38);
  font-size:8.5px;
  letter-spacing:.03em;
  line-height:1.5;
  cursor:pointer;
  transition:.2s;
}
.case-link:hover{color:var(--clay);border-color:rgba(181,110,81,.28);background:rgba(255,253,248,.85)}

/* carry band */
.carry-band{
  display:grid;
  grid-template-columns:72px minmax(0,1fr) auto;
  align-items:center;
  gap:14px;
  margin-bottom:16px;
  padding:13px 15px;
  border:1px solid rgba(173,133,83,.24);
  border-radius:15px;
  background:linear-gradient(120deg,rgba(236,224,204,.48),rgba(255,253,248,.40));
  animation:fadeUp .55s .05s var(--ease) both;
}
.carry-kicker{color:#8a6a43;font-size:8.5px;letter-spacing:.13em;line-height:1.5}
.carry-quote{margin:0;color:#5e4a32;font-family:var(--serif);font-size:12px;line-height:1.7}
.carry-quote::before{content:"「";color:var(--gold)}
.carry-quote::after{content:"」";color:var(--gold)}
.carry-back{
  padding:4px 7px;
  border:1px solid rgba(173,133,83,.22);
  border-radius:999px;
  color:#87673f;
  background:rgba(255,253,248,.35);
  font-size:8.5px;
  white-space:nowrap;
}
.carry-back:hover{background:var(--paper-3)}

/* depth rail */
.depth-rail{
  position:relative;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:0;
  max-width:680px;
  margin:22px 0 17px;
  padding:0 6px;
}
.depth-rail::before{
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  top:13px;
  height:1px;
  background:linear-gradient(90deg,rgba(34,48,42,.14),rgba(34,48,42,.07));
}
.depth-item{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  padding:0 4px;
  border:0;
  background:transparent;
  color:var(--ink-faint);
  text-align:center;
}
.depth-dot{
  display:grid;
  place-items:center;
  width:27px;height:27px;
  border:1px solid rgba(34,48,42,.16);
  border-radius:50%;
  color:var(--ink-faint);
  background:var(--paper);
  font-family:var(--mono);
  font-size:8.5px;
  transition:.25s var(--ease);
}
.depth-label{font-size:9.5px;letter-spacing:.04em;line-height:1.4;white-space:nowrap}
.depth-item.done{color:var(--ink-soft);cursor:pointer}
.depth-item.done .depth-dot{border-color:rgba(125,151,136,.55);color:#476253;background:var(--sage-soft)}
.depth-item.done .depth-dot::after{content:"✓";font-family:var(--sans);font-size:10px}
.depth-item.done .depth-dot span{display:none}
.depth-item.active{color:var(--ink)}
.depth-item.active .depth-dot{
  border-color:rgba(173,133,83,.72);
  color:#74552f;
  background:var(--gold-soft);
  box-shadow:0 0 0 5px rgba(173,133,83,.07);
}
.depth-item.active .depth-label{color:var(--ink-soft)}
.depth-item.future{opacity:.48}

/* step card */
.step-card{
  position:relative;
  scroll-margin-top:18px;
  max-width:680px;
  padding:29px 30px 25px;
  border:1px solid rgba(34,48,42,.11);
  border-radius:25px;
  background:rgba(255,253,248,.72);
  box-shadow:var(--shadow-soft);
  backdrop-filter:blur(14px);
  animation:cardIn .45s var(--ease) both;
  overflow:hidden;
}
.step-card::after{
  content:attr(data-step);
  position:absolute;
  right:22px;
  top:12px;
  color:rgba(173,133,83,.10);
  font-family:var(--serif);
  font-size:78px;
  line-height:1;
  pointer-events:none;
}
.step-kicker{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:9px;
  color:var(--sage);
  font-family:var(--mono);
  font-size:8.5px;
  letter-spacing:.17em;
  text-transform:uppercase;
}
.step-kicker::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.step-card h2{
  position:relative;
  z-index:1;
  max-width:560px;
  margin:0;
  font-family:var(--serif);
  font-size:clamp(23px,2.3vw,31px);
  font-weight:400;
  line-height:1.45;
  letter-spacing:.02em;
}
.step-card h2 em{font-style:normal;color:var(--clay)}
.step-card .step-desc{
  position:relative;
  z-index:1;
  max-width:560px;
  margin:8px 0 0;
  color:var(--ink-faint);
  font-size:11.5px;
  line-height:1.8;
}
.step-fields{position:relative;z-index:1;margin-top:20px}
.step-actions{position:relative;z-index:1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px}
.mini-note{color:var(--ink-faint);font-size:9.5px}

/* fields */
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field-label{display:block;margin-bottom:7px;color:var(--ink-soft);font-size:10.5px;letter-spacing:.03em}
.field-label .optional{color:var(--ink-faint);font-size:9px}
textarea,input[type=text],input[type=password],input[type=url],select{
  width:100%;
  border:1px solid rgba(34,48,42,.13);
  border-radius:13px;
  color:var(--ink);
  background:rgba(255,253,248,.74);
  transition:.2s var(--ease);
}
textarea{
  display:block;
  min-height:105px;
  padding:13px 15px;
  line-height:1.8;
  resize:vertical;
}
textarea::placeholder,input::placeholder{color:#98a19a;opacity:1}
textarea:focus,input[type=text]:focus,input[type=password]:focus,input[type=url]:focus,select:focus{
  outline:none;
  border-color:rgba(173,133,83,.58);
  background:var(--paper-3);
  box-shadow:0 0 0 4px rgba(173,133,83,.08);
}
input[type=text],input[type=password],input[type=url],select{height:42px;padding:0 13px}
input[type=text].compact{height:39px}
select{cursor:pointer}
.form-row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:11px;align-items:end}
.form-row .field{margin-bottom:0}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:13px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:7px 11px;
  border:1px solid rgba(34,48,42,.13);
  border-radius:999px;
  color:var(--ink-soft);
  background:rgba(255,253,248,.48);
  font-size:11px;
  line-height:1.2;
  transition:.2s var(--ease);
}
.chip:hover{border-color:rgba(125,151,136,.5);background:rgba(255,253,248,.92);transform:translateY(-1px)}
.chip.selected{border-color:rgba(125,151,136,.58);color:#355044;background:var(--sage-soft)}
.chip.selected::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--sage)}
.chip.clay.selected{border-color:rgba(181,110,81,.46);color:#7b4230;background:var(--clay-soft)}
.chip.clay.selected::before{background:var(--clay)}
.chip-group + .chip-group{margin-top:14px}
.chip-title{display:flex;align-items:center;gap:7px;margin:0 0 8px;color:var(--ink-faint);font-size:9.5px;letter-spacing:.06em}

/* intensity */
.intensity{display:flex;align-items:center;gap:12px;margin-top:17px;padding-top:13px;border-top:1px dashed var(--line-soft)}
.intensity-label{flex:none;color:var(--ink-faint);font-size:9.5px;letter-spacing:.05em}
.intensity-value{
  display:grid;
  place-items:center;
  width:33px;height:33px;
  flex:none;
  border:1px solid rgba(181,110,81,.28);
  border-radius:50%;
  color:var(--clay);
  background:rgba(255,253,248,.7);
  font-family:var(--mono);
  font-size:12px;
}
input[type=range]{width:100%;height:20px;margin:0;appearance:none;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:10px;background:linear-gradient(90deg,var(--clay) var(--val,50%),rgba(34,48,42,.12) var(--val,50%))}
input[type=range]::-moz-range-track{height:2px;border-radius:10px;background:rgba(34,48,42,.12)}
input[type=range]::-moz-range-progress{height:2px;background:var(--clay)}
input[type=range]::-webkit-slider-thumb{appearance:none;width:14px;height:14px;margin-top:-6px;border:2px solid var(--paper-3);border-radius:50%;background:var(--clay);box-shadow:0 1px 5px rgba(34,48,42,.22)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:2px solid var(--paper-3);border-radius:50%;background:var(--clay)}
.range-ends{display:flex;justify-content:space-between;margin-top:1px;color:var(--ink-faint);font-size:8.5px}

/* summary */
.summary-card{
  margin-top:15px;
  padding:19px 20px;
  border:1px solid rgba(125,151,136,.28);
  border-radius:17px;
  background:linear-gradient(145deg,rgba(237,242,236,.82),rgba(255,253,248,.56));
}
.summary-label{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:8px;
  color:var(--sage);
  font-family:var(--mono);
  font-size:8.5px;
  letter-spacing:.14em;
}
.summary-text{
  margin:0;
  color:#3e5548;
  font-family:var(--serif);
  font-size:16px;
  line-height:1.85;
  white-space:pre-wrap;
}
.summary-card textarea{
  width:100%;
  min-height:88px;
  margin:0;
  padding:0;
  border:0;
  border-radius:0;
  background:transparent;
  color:#3e5548;
  font-family:var(--serif);
  font-size:15.5px;
  line-height:1.85;
  box-shadow:none;
  resize:vertical;
}
.summary-card textarea:focus{box-shadow:none;background:transparent}
.summary-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.polish-btn{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 0;
  border:0;
  color:#6d8677;
  background:transparent;
  font-size:9.5px;
  text-decoration:underline;
  text-underline-offset:3px;
  text-decoration-color:rgba(109,134,119,.3);
}
.polish-btn:hover{color:var(--clay)}
.polish-btn:disabled{opacity:.4}
.summary-hint{margin-top:10px;color:var(--ink-faint);font-size:9.5px;line-height:1.65}

/* buttons */
.primary-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:42px;
  padding:0 18px;
  border:1px solid transparent;
  border-radius:999px;
  color:#f9f4e9;
  background:var(--forest);
  font-size:11.5px;
  letter-spacing:.04em;
  box-shadow:0 8px 20px rgba(27,42,35,.14);
  transition:.25s var(--ease);
}
.primary-btn:hover{background:#2b4034;transform:translateY(-1px);box-shadow:0 11px 24px rgba(27,42,35,.19)}
.primary-btn svg{width:13px;height:13px;transition:transform .2s}
.primary-btn:hover svg{transform:translateX(2px)}
.primary-btn:disabled{transform:none;box-shadow:none}
.secondary-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:36px;
  padding:0 13px;
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--ink-soft);
  background:rgba(255,253,248,.46);
  font-size:10px;
  text-decoration:none;
  transition:.2s var(--ease);
}
.secondary-btn:hover{background:var(--paper-3);border-color:rgba(34,48,42,.22)}
.secondary-btn svg{width:12px;height:12px}
.text-btn{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 0;
  border:0;
  color:var(--ink-faint);
  background:transparent;
  font-size:9.5px;
  text-decoration:underline;
  text-underline-offset:3px;
  text-decoration-color:rgba(34,48,42,.2);
}
.text-btn:hover{color:var(--clay);text-decoration-color:rgba(181,110,81,.4)}

/* note */
.soft-note{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin-top:13px;
  padding:9px 11px;
  border:1px dashed rgba(125,151,136,.30);
  border-radius:11px;
  color:#658071;
  background:rgba(237,242,236,.38);
  font-size:9.5px;
  line-height:1.7;
}
.soft-note svg{width:11px;height:11px;flex:none;margin-top:3px}

/* stage nav */
.stage-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  max-width:680px;
  margin-top:19px;
  padding-top:16px;
  border-top:1px solid var(--line-soft);
}
.stage-nav .left{display:flex;align-items:center;gap:9px}
.stage-nav-hint{color:var(--ink-faint);font-size:9.5px}

/* companion */
.companion{
  align-self:start;
  position:sticky;
  top:0;
  display:flex;
  flex-direction:column;
  min-height:390px;
  max-height:calc(100dvh - 160px);
  margin-top:24px;
  padding:17px 18px 15px;
  border:1px solid rgba(34,48,42,.12);
  border-radius:25px;
  background:rgba(255,252,245,.68);
  box-shadow:var(--shadow);
  backdrop-filter:blur(16px);
  animation:fadeUp .6s .08s var(--ease) both;
  overflow:hidden;
}
.companion-head{display:flex;align-items:center;gap:10px;padding-bottom:13px;border-bottom:1px solid var(--line-soft)}
.companion-avatar{
  position:relative;
  display:grid;
  place-items:center;
  width:38px;height:38px;
  flex:none;
  overflow:hidden;
  border:1px solid rgba(125,151,136,.36);
  border-radius:50%;
  color:#f6eddc;
  background:linear-gradient(145deg,#728f7d,#3b5648);
  box-shadow:inset 0 0 15px rgba(255,255,255,.13);
}
.companion-avatar::after{content:"";position:absolute;inset:5px;border:1px solid rgba(255,255,255,.20);border-radius:50%}
.companion-avatar span{font-family:var(--serif);font-size:15px}
.companion-head h2{
  display:flex;
  align-items:center;
  gap:6px;
  margin:0;
  font-family:var(--serif);
  font-size:15px;
  font-weight:400;
  letter-spacing:.08em;
  line-height:1.2;
}
.companion-head h2 i{
  width:5px;height:5px;
  border-radius:50%;
  background:var(--sage);
  box-shadow:0 0 9px rgba(125,151,136,.7);
  font-style:normal;
}
.companion-status{
  margin:3px 0 0;
  color:var(--ink-faint);
  font-size:8.5px;
  letter-spacing:.02em;
}
.companion-status.connected{color:#5c7a67}
.companion-scroll{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:19px 1px 12px;
  scrollbar-width:thin;
  scrollbar-color:rgba(34,48,42,.12) transparent;
}
.reflection-kicker{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:12px;
  color:var(--gold);
  font-family:var(--mono);
  font-size:8px;
  letter-spacing:.17em;
  text-transform:uppercase;
}
.reflection-kicker::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.reflection-text{
  min-height:150px;
  color:var(--ink);
  font-family:var(--serif);
  font-size:16px;
  line-height:1.95;
  letter-spacing:.015em;
  white-space:pre-wrap;
  animation:reflectionIn .45s var(--ease) both;
}
.reflection-text.placeholder{color:var(--ink-faint);font-size:13px;line-height:1.9}
.reflection-text .typing-dots{display:inline-flex;gap:4px;margin-top:8px;vertical-align:middle}
.reflection-text .typing-dots i{width:4px;height:4px;border-radius:50%;background:var(--sage);animation:typing 1.3s infinite}
.reflection-text .typing-dots i:nth-child(2){animation-delay:.15s}
.reflection-text .typing-dots i:nth-child(3){animation-delay:.3s}
.reflection-sign{
  margin-top:16px;
  color:var(--ink-faint);
  font-family:var(--serif);
  font-size:10px;
  letter-spacing:.12em;
  text-align:right;
}
.reflection-sign::before{content:"—— ";}
.reflection-error{
  margin-top:10px;
  color:#97604a;
  font-size:8.5px;
  line-height:1.6;
}
.companion-foot{
  flex:none;
  padding-top:11px;
  border-top:1px solid var(--line-soft);
  color:var(--ink-faint);
  font-size:8px;
  line-height:1.6;
  text-align:center;
}
.companion-foot b{font-weight:500;color:var(--ink-soft)}

/* ============================================================
   Modals
   ============================================================ */
.modal-layer{
  position:fixed;
  inset:0;
  z-index:1000;
  display:grid;
  place-items:center;
  padding:24px;
  background:rgba(17,26,21,.50);
  backdrop-filter:blur(9px);
  animation:fadeIn .22s ease both;
}
.modal{
  position:relative;
  display:flex;
  flex-direction:column;
  width:min(560px,100%);
  max-height:min(87dvh,790px);
  overflow:hidden;
  border:1px solid rgba(255,255,255,.12);
  border-radius:26px;
  background:var(--paper-2);
  box-shadow:0 35px 100px rgba(10,18,13,.34);
  animation:modalUp .35s var(--ease) both;
}
.modal.wide{width:min(720px,100%)}
.modal.narrow{width:min(465px,100%)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:22px 24px 16px;border-bottom:1px solid var(--line-soft)}
.modal-kicker{display:flex;align-items:center;gap:8px;margin-bottom:5px;color:var(--gold);font-family:var(--mono);font-size:8px;letter-spacing:.2em}
.modal-kicker::before{content:"";width:17px;height:1px;background:var(--gold);opacity:.55}
.modal-head h2{margin:0;font-family:var(--serif);font-size:24px;font-weight:400;line-height:1.35;letter-spacing:.03em}
.modal-head p{margin:5px 0 0;color:var(--ink-faint);font-size:10px;line-height:1.7}
.modal-close{display:grid;place-items:center;width:30px;height:30px;flex:none;border:1px solid var(--line);border-radius:50%;color:var(--ink-faint);background:transparent}
.modal-close:hover{background:var(--paper-3);color:var(--ink)}
.modal-close svg{width:12px;height:12px}
.modal-body{padding:19px 24px 22px;overflow-y:auto}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:13px 24px 19px;border-top:1px solid var(--line-soft);background:rgba(250,247,240,.64)}

/* settings */
.setting-section{padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line-soft)}
.setting-section:last-child{padding-bottom:0;margin-bottom:0;border-bottom:0}
.setting-section h3{display:flex;align-items:center;gap:7px;margin:0 0 4px;color:var(--ink-soft);font-size:11px;font-weight:500;letter-spacing:.05em}
.setting-section h3 svg{width:12px;height:12px;color:var(--sage)}
.setting-section > p{margin:0 0 12px;color:var(--ink-faint);font-size:10px;line-height:1.7}
.key-wrap{position:relative}
.key-wrap input{padding-right:58px;font-family:var(--mono);font-size:10.5px}
.key-toggle{position:absolute;right:5px;top:5px;display:grid;place-items:center;width:46px;height:31px;border:0;border-radius:8px;color:var(--ink-faint);background:transparent;font-size:9px;white-space:nowrap}
.key-toggle:hover{color:var(--ink);background:var(--sage-pale)}
.check-label{display:flex;align-items:center;gap:7px;color:var(--ink-soft);font-size:10px;cursor:pointer}
.check-label input{width:13px;height:13px;accent-color:var(--sage)}
.advanced{margin-top:12px;border-top:1px dashed var(--line-soft);padding-top:9px}
.advanced summary{cursor:pointer;color:var(--ink-faint);font-size:9.5px;letter-spacing:.03em;list-style:none}
.advanced summary::-webkit-details-marker{display:none}
.advanced summary::before{content:"＋";margin-right:5px;color:var(--gold);font-size:9px}
.advanced[open] summary::before{content:"－"}
.advanced-body{padding-top:11px}
.connection-status{display:flex;align-items:center;gap:6px;min-height:16px;margin-top:8px;color:var(--ink-faint);font-size:9.5px;line-height:1.5}
.connection-status .status-dot{width:5px;height:5px;flex:none;border-radius:50%;background:var(--ink-faint)}
.connection-status.ok{color:#4d6b58}
.connection-status.ok .status-dot{background:#5d8a6c;box-shadow:0 0 8px rgba(93,138,108,.5)}
.connection-status.err{color:#965d45}
.connection-status.err .status-dot{background:var(--clay)}
.connection-status.loading .status-dot{background:var(--gold);animation:softPulse 1.2s infinite}
.help-note{margin-top:10px;padding:9px 11px;border-radius:10px;background:rgba(236,224,204,.28);color:#7e6748;font-size:9px;line-height:1.65}
.setting-section code{padding:1px 4px;border-radius:4px;background:rgba(34,48,42,.06);font-family:var(--mono);font-size:9px;color:#536a5c}
.data-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.data-actions .secondary-btn{font-size:9.5px;min-height:33px}
.danger-btn{color:#965d45;border-color:rgba(181,110,81,.25);background:rgba(239,221,211,.22)}
.danger-btn:hover{background:var(--clay-soft);border-color:rgba(181,110,81,.4);color:#82412e}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* emergency support */
.emergency-modal .modal-head h2{color:#6f4030}
.emergency-steps{display:grid;gap:8px;margin:0 0 15px;padding:0;list-style:none}
.emergency-step{display:flex;gap:10px;padding:10px 12px;border:1px solid rgba(181,110,81,.16);border-radius:12px;background:rgba(247,234,225,.27)}
.emergency-step .n{display:grid;place-items:center;width:19px;height:19px;flex:none;border:1px solid rgba(181,110,81,.34);border-radius:50%;color:#8f533d;font-family:var(--mono);font-size:8px}
.emergency-step p{margin:0;color:#744c3d;font-size:10.5px;line-height:1.7}
.emergency-step b{display:block;color:#6c4333;font-weight:500}
.crisis-lines{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}
.crisis-line{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border:1px solid rgba(181,110,81,.17);border-radius:11px;background:rgba(255,253,248,.5);color:#754939;font-size:9.5px;text-decoration:none}
.crisis-line:hover{background:var(--paper-3)}
.crisis-line b{font-family:var(--mono);font-size:11px;font-weight:400}
.crisis-note{margin-top:12px;color:var(--ink-faint);font-size:8.5px;line-height:1.65}

/* case reference */
.case-modal .modal-body{padding-top:17px}
.case-meta{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:7px;
  color:#74847a;
  font-family:var(--mono);
  font-size:8.5px;
  letter-spacing:.06em;
}
.case-meta::before{
  content:"";
  width:5px;height:5px;
  border-radius:50%;
  background:var(--sage);
}
.case-intro{
  margin:0 0 17px;
  padding:12px 14px;
  border-left:2px solid rgba(125,151,136,.35);
  color:#7d8b83;
  background:rgba(237,242,236,.34);
  font-size:10.5px;
  line-height:1.85;
}
.case-section{
  display:grid;
  grid-template-columns:62px minmax(0,1fr);
  gap:13px;
  padding:11px 0;
  border-top:1px dashed rgba(34,48,42,.075);
}
.case-section-label{
  padding-top:2px;
  color:#9a855e;
  font-family:var(--mono);
  font-size:8.5px;
  letter-spacing:.08em;
  line-height:1.7;
}
.case-section-text{
  margin:0;
  color:#74827a;
  font-family:var(--serif);
  font-size:12px;
  line-height:1.9;
  white-space:pre-wrap;
}
.case-scroll-hint{
  margin:0 0 8px;
  color:#9aa39c;
  font-size:8px;
  text-align:right;
  letter-spacing:.04em;
}
.case-note{
  margin:17px 0 0;
  padding:10px 12px;
  border-radius:10px;
  color:#8b9690;
  background:rgba(236,224,204,.24);
  font-size:9px;
  line-height:1.7;
}
.case-note b{color:#7a6849;font-weight:500}

/* handoff */
.handoff-modal .modal-head{display:none}
.handoff-card{position:relative;padding:38px 40px 31px;text-align:center;overflow:hidden}
.handoff-card::before{
  content:"";
  position:absolute;
  top:-120px;right:-90px;
  width:300px;height:300px;
  border:1px solid rgba(173,133,83,.17);
  border-radius:50%;
  box-shadow:0 0 0 34px rgba(173,133,83,.028),0 0 0 68px rgba(173,133,83,.016);
}
.handoff-card .handoff-mark{
  display:grid;
  place-items:center;
  width:48px;height:48px;
  margin:0 auto 17px;
  border:1px solid rgba(173,133,83,.42);
  border-radius:50%;
  color:var(--gold);
  font-family:var(--serif);
  font-size:18px;
  transform:rotate(-5deg);
}
.handoff-card .modal-kicker{justify-content:center}
.handoff-card .modal-kicker::before{display:none}
.handoff-card h2{margin:0;font-family:var(--serif);font-size:29px;font-weight:400;line-height:1.5;letter-spacing:.03em}
.handoff-card h2 em{font-style:normal;color:var(--clay)}
.handoff-quote{
  max-width:450px;
  margin:18px auto 0;
  padding:16px 19px;
  border-top:1px solid rgba(173,133,83,.25);
  border-bottom:1px solid rgba(173,133,83,.25);
  color:#4f6456;
  font-family:var(--serif);
  font-size:16px;
  line-height:1.9;
}
.handoff-quote::before{content:"「";color:var(--gold)}
.handoff-quote::after{content:"」";color:var(--gold)}
.handoff-card p{margin:14px 0 0;color:var(--ink-faint);font-size:10px;line-height:1.8}
.handoff-actions{display:flex;justify-content:center;gap:9px;margin-top:21px;flex-wrap:wrap}

/* completion */
.complete-wrap{padding:26px 26px 24px}
.complete-card{
  padding:25px 26px 22px;
  border:1px solid rgba(173,133,83,.30);
  border-radius:16px;
  background:rgba(255,253,248,.56);
  text-align:center;
}
.complete-seal{
  display:grid;
  place-items:center;
  width:51px;height:51px;
  margin:0 auto 12px;
  border:1px solid rgba(181,110,81,.44);
  border-radius:50%;
  color:var(--clay);
  font-family:var(--serif);
  font-size:9.5px;
  line-height:1.2;
  transform:rotate(-6deg);
}
.complete-card h2{margin:0;font-family:var(--serif);font-size:26px;font-weight:400;letter-spacing:.1em}
.complete-card > p{margin:7px 0 0;color:var(--ink-faint);font-size:9.5px}
.complete-acts{margin-top:5px;color:var(--ink-faint);font-size:9px;letter-spacing:.13em;line-height:1.7}
.complete-scroll-hint{margin:0 0 9px;color:var(--ink-faint);font-size:8.5px;text-align:right;letter-spacing:.04em}
.complete-thread{margin:19px 0 0;padding:15px 0 0;border-top:1px solid var(--line-soft);text-align:left}
.complete-thread-row{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:7px 0}
.complete-thread-row + .complete-thread-row{border-top:1px dashed var(--line-soft)}
.complete-thread-row dt{margin:0;color:var(--gold);font-size:8px;letter-spacing:.1em;line-height:1.9}
.complete-thread-row dd{margin:0;color:var(--ink-soft);font-family:var(--serif);font-size:11px;line-height:1.8;white-space:pre-wrap}
.complete-thread-row dd.empty{color:var(--ink-faint);font-family:var(--sans);font-size:9.5px}
.next-act-note{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:15px;
  padding:10px 12px;
  border:1px dashed rgba(125,151,136,.28);
  border-radius:11px;
  color:#678071;
  background:rgba(237,242,236,.36);
  font-size:9.5px;
  line-height:1.65;
}
.next-act-note b{font-weight:500;color:#486354}

/* first-visit consent */
.consent-layer{
  position:fixed;
  inset:0;
  z-index:2000;
  display:grid;
  place-items:center;
  padding:24px;
  background:rgba(17,26,21,.58);
  backdrop-filter:blur(10px);
  animation:fadeIn .25s ease both;
}
.consent-card{
  width:min(600px,100%);
  max-height:90dvh;
  overflow-y:auto;
  padding:32px 34px 27px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:26px;
  background:linear-gradient(155deg,#fbf8f1,#f2eadc);
  box-shadow:0 35px 100px rgba(10,18,13,.34);
  animation:modalUp .4s var(--ease) both;
}
.consent-mark{
  display:grid;
  place-items:center;
  width:46px;height:46px;
  margin-bottom:16px;
  border:1px solid rgba(34,48,42,.24);
  border-radius:50%;
  color:var(--forest);
  font-family:var(--serif);
  font-size:19px;
  transform:rotate(-5deg);
}
.consent-kicker{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
  color:var(--gold);
  font-family:var(--mono);
  font-size:8px;
  letter-spacing:.2em;
}
.consent-kicker::before{content:"";width:18px;height:1px;background:var(--gold);opacity:.55}
.consent-card h2{
  margin:0;
  font-family:var(--serif);
  font-size:clamp(24px,3vw,31px);
  font-weight:400;
  line-height:1.5;
  letter-spacing:.02em;
}
.consent-card h2 em{font-style:normal;color:var(--clay)}
.consent-lead{
  margin:10px 0 0;
  color:var(--ink-soft);
  font-size:11px;
  line-height:1.85;
}
.consent-list{
  display:grid;
  gap:8px;
  margin:17px 0 16px;
  padding:14px 15px;
  border:1px solid rgba(34,48,42,.09);
  border-radius:13px;
  background:rgba(255,253,248,.48);
  list-style:none;
}
.consent-list li{
  position:relative;
  padding-left:13px;
  color:#5f6f66;
  font-size:10px;
  line-height:1.75;
}
.consent-list li::before{
  content:"";
  position:absolute;
  left:0;
  top:.72em;
  width:4px;height:4px;
  border-radius:50%;
  background:var(--sage);
}
.consent-list b{color:#465b4e;font-weight:500}
.consent-checks{display:grid;gap:9px;margin-bottom:16px}
.consent-check{
  display:flex;
  align-items:flex-start;
  gap:8px;
  color:#5d6d64;
  font-size:10px;
  line-height:1.7;
  cursor:pointer;
}
.consent-check input{
  width:14px;height:14px;
  flex:none;
  margin-top:2px;
  accent-color:var(--sage);
}
.consent-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.consent-actions .primary-btn:disabled{opacity:.42;box-shadow:none;transform:none}
.consent-foot{
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid rgba(34,48,42,.08);
  color:#8a958e;
  font-size:8.5px;
  line-height:1.6;
}
.consent-foot a{color:#7f6642;text-decoration:underline;text-underline-offset:3px}

/* toast */
.toast-root{position:fixed;left:50%;bottom:26px;z-index:1200;display:flex;flex-direction:column;align-items:center;gap:8px;transform:translateX(-50%);pointer-events:none}
.toast{padding:9px 15px;border:1px solid rgba(255,255,255,.10);border-radius:999px;color:#f5efe3;background:rgba(27,42,35,.92);font-size:10px;letter-spacing:.02em;box-shadow:0 8px 26px rgba(10,18,13,.22);animation:toastIn .3s var(--ease) both}
.toast.out{animation:toastOut .28s ease both}

/* ============================================================
   Motion
   ============================================================ */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(8px) scale(.995)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes reflectionIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes modalUp{from{opacity:0;transform:translateY(13px) scale(.988)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-3px);opacity:1}}
@keyframes softPulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.85;transform:scale(1.12)}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px) scale(.98)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width:1240px){
  .app{grid-template-columns:258px minmax(0,1fr)}
  .page{grid-template-columns:minmax(0,1fr) 330px;gap:22px;padding-left:31px;padding-right:31px}
  .topbar,.thread-bar{padding-left:31px;padding-right:31px}
  .thread-bar{margin-left:31px;margin-right:31px;padding-left:0;padding-right:0}
  .stage-head h1{font-size:clamp(38px,3.6vw,49px)}
}
@media (max-width:1080px){
  .app{height:auto;min-height:100dvh;grid-template-columns:238px minmax(0,1fr);overflow:visible}
  .sidebar{height:100dvh;position:sticky;top:0}
  .main{min-height:100dvh;overflow:visible}
  .page{grid-template-columns:1fr;padding-bottom:39px}
  .stage-main{overflow:visible;padding-right:0}
  .companion{position:relative;top:auto;max-height:none;min-height:0;margin-top:0;padding:17px 18px 14px}
  .companion-scroll{overflow:visible}
  .reflection-text{min-height:0}
  .companion-foot{padding-top:10px}
  .stage-nav{max-width:none}
  .depth-rail,.stage-head,.step-card,.carry-band{max-width:none}
}
@media (max-width:860px){
  .app{display:block}
  .sidebar{
    position:sticky;
    top:0;
    z-index:50;
    display:block;
    width:100%;
    height:auto;
    padding:12px 16px 10px;
    overflow:visible;
    background:linear-gradient(110deg,#203229,#19261f);
  }
  .sidebar::after{display:none}
  .brand{display:none}
  .date-line{margin:0 0 8px 2px;font-size:9px;letter-spacing:.02em}
  .side-label,.side-thread,.sidebar-foot,.privacy-note{display:none}
  .journey{flex-direction:row;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .journey::-webkit-scrollbar{display:none}
  .journey::before{display:none}
  .stage-link{
    grid-template-columns:23px auto;
    gap:7px;
    width:auto;
    min-width:83px;
    min-height:38px;
    padding:5px 9px;
    border-radius:10px;
    flex:none;
  }
  .stage-link.active::before{top:auto;bottom:0;left:10px;right:10px;width:auto;height:2px}
  .stage-num{width:21px;height:21px;font-size:8px;margin-left:0}
  .stage-copy b{font-size:14px;letter-spacing:.08em}
  .stage-copy small{display:none}
  .stage-state{display:none}
  .main{min-height:0;overflow:visible}
  .main::before{display:none}
  .topbar{padding:15px 20px 0}
  .thread-bar{margin:13px 20px 0}
  .thread-panel{grid-template-columns:1fr;padding-left:13px;padding-right:13px}
  .thread-panel-row{grid-template-columns:48px minmax(0,1fr);gap:9px}
  .page{padding:0 20px 30px}
  .stage-main{padding-top:20px}
  .stage-head h1{font-size:46px}
  .stage-head p{font-size:13px}
  .carry-band{grid-template-columns:1fr;gap:7px;padding:12px 13px}
  .carry-kicker,.carry-quote,.carry-back{grid-column:1;grid-row:auto}
  .carry-quote{font-size:11.5px}
  .carry-back{justify-self:start;margin-top:2px}
  .depth-rail{overflow-x:auto;padding-bottom:3px;gap:2px}
  .depth-item{min-width:76px}
  .reflection-text{font-size:15px}
}
@media (max-width:620px){
  .topbar{padding:12px 16px 0}
  .breadcrumb{font-size:8px;letter-spacing:.1em}
  .breadcrumb .proto-pill{padding:2px 6px}
  .top-actions .ghost-btn{padding:7px 10px;font-size:9.5px}
  .thread-bar{margin-left:16px;margin-right:16px}
  .thread-bar-main{padding-left:12px;padding-right:9px;gap:9px}
  .thread-title{font-size:8px;letter-spacing:.1em}
  .thread-preview{font-size:10.5px}
  .thread-toggle{font-size:8px;padding-left:5px;padding-right:5px}
  .page{padding:0 16px 24px}
  .stage-main{padding-top:17px;padding-bottom:34px}
  .stage-head h1{font-size:39px;letter-spacing:.08em}
  .stage-head p{font-size:12px}
  .stage-head p span{font-size:9.5px}
  .stage-scope{font-size:8.5px}
  .depth-rail{margin-top:17px;margin-bottom:13px}
  .depth-item{min-width:66px}
  .depth-label{font-size:8.5px}
  .depth-dot{width:24px;height:24px;font-size:8px}
  .step-card{padding:23px 18px 20px;border-radius:21px}
  .step-card::after{font-size:60px;right:14px;top:9px}
  .step-card h2{font-size:22px}
  .step-desc{font-size:10.5px}
  .form-row,.two-col,.form-grid{grid-template-columns:1fr}
  .form-row .field{margin-bottom:12px}
  .step-actions{gap:10px}
  .step-actions .mini-note{width:100%}
  .summary-card{padding:15px 14px}
  .summary-text{font-size:14.5px}
  .summary-card textarea{font-size:14px;min-height:110px}
  .stage-nav{flex-direction:column;align-items:flex-start;gap:9px}
  .companion{padding:14px 14px 12px;border-radius:20px}
  .reflection-text{font-size:14.5px}
  .modal-layer{padding:11px;align-items:end}
  .consent-layer{padding:11px;align-items:end}
  .consent-card{padding:25px 21px 22px;border-radius:21px}
  .consent-list{padding:12px}
  .consent-list li{font-size:9.5px}
  .modal{max-height:92dvh;border-radius:21px}
  .modal-head{padding:18px 18px 13px}
  .modal-head h2{font-size:20px}
  .modal-body{padding:16px 18px 19px}
  .modal-foot{padding:11px 18px 15px}
  .handoff-card{padding:29px 20px 25px}
  .handoff-card h2{font-size:23px}
  .handoff-quote{font-size:14px;margin-top:14px}
  .complete-wrap{padding:17px 17px 16px}
  .complete-card{padding:20px 16px 17px}
  .complete-card h2{font-size:22px}
  .complete-thread-row{grid-template-columns:42px minmax(0,1fr);gap:8px}
}
@media (max-width:380px){
  .stage-link{min-width:74px;padding-left:7px;padding-right:7px}
  .stage-copy b{font-size:13px}
  .stage-head h1{font-size:35px}
  .thread-title{display:none}
}

  <main class="main">

      </div>
      <div class="top-actions">
        <button class="ghost-btn" type="button" id="threadTopBtn">主线</button>
        <button class="icon-btn support-btn" type="button" id="supportBtn" aria-label="此刻很难受，打开即时支持" title="此刻很难受？">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 21c-4.3-2.2-7-5.3-7-9a7 7 0 0 1 14 0c0 3.7-2.7 6.8-7 9z"></path><path d="M12 8v4M12 15h.01"></path></svg>

function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'

}
function escAttr(value) { return esc(value).replace(/\n/g, '&#10;'); }
function clone(obj) { return JSON.parse(JSON.stringify(obj)); }
function compact(text, max = 110) {
  const t = String(text || '').replace(/\s+/g, ' ').trim();
  return t.length > max ? t.slice(0, max) + '…' : t;
}
function cleanEnd(text) {
  return String(text || '')

    .replace(/[。！？；，、\s]+$/g, '')
    .trim();

function formatDate(ts) {

}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function getPath(obj, path) {
  return path.split('.').reduce((acc, key) => (acc == null ? undefined : acc[key]), obj);
}
function setPath(obj, path, value) {
  const parts = path.split('.');
  let target = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    if (!target[parts[i]] || typeof target[parts[i]] !== 'object') target[parts[i]] = {};
    target = target[parts[i]];
  }
  target[parts[parts.length - 1]] = value;
}
function deepMerge(base, saved) {
  if (Array.isArray(base)) return Array.isArray(saved) ? saved : base;
  if (base && typeof base === 'object') {
    const out = {};
    Object.keys(base).forEach(key => {
      out[key] = saved && Object.prototype.hasOwnProperty.call(saved, key)
        ? deepMerge(base[key], saved[key])
        : base[key];
    });
    if (saved && typeof saved === 'object') {
      Object.keys(saved).forEach(key => { if (!(key in out)) out[key] = saved[key]; });
    }
    return out;
  }
  return saved === undefined ? base : saved;
}

  } catch (err) {
    console.warn('读取本地记录失败', err);
    return makeState();
  }

function getApiKey() {
  try {
    return (sessionStorage.getItem(KEY_SESSION) || localStorage.getItem(KEY_LOCAL) || '').trim();
  } catch (_) {
    return '';
  }
}
function hasApiKey() { return Boolean(getApiKey()); }
function storeApiKey(key, remember) {
  const clean = String(key || '').trim();
  if (!clean) {
    sessionStorage.removeItem(KEY_SESSION);
    localStorage.removeItem(KEY_LOCAL);
    return;
  }
  if (remember) {
    localStorage.setItem(KEY_LOCAL, clean);
    sessionStorage.removeItem(KEY_SESSION);
  } else {
    sessionStorage.setItem(KEY_SESSION, clean);
    localStorage.removeItem(KEY_LOCAL);
  }
}
function clearStoredApiKeys() {

    sessionStorage.removeItem(KEY_SESSION);
    localStorage.removeItem(KEY_LOCAL);
    LEGACY_KEY_NAMES.forEach(name => {

      localStorage.removeItem(name);
    });
  } catch (_) { /* storage may be unavailable */ }
}
function endpointFrom() {

function threadBody(value, label) {

function threadDisplay(id, value) {

}
function renderThread() {
  const preview = $('#threadPreview');
  const previousId = PREV_STAGE[state.stage];
  const previewId = state.thread[state.stage]
    ? state.stage
    : (previousId && state.thread[previousId] ? previousId : [...STAGE_ORDER].reverse().find(id => state.thread[id]));
  if (previewId) {
    preview.textContent = compact(threadDisplay(previewId, state.thread[previewId]), 78);
    preview.classList.remove('empty');
  } else {

  };
  setThreadValue('#sideSee', threadBody(state.thread.see, '我看见'), '尚未形成');
  setThreadValue('#sideTrace', state.thread.trace, '尚未形成');
  setThreadValue('#sideMourn', compact(state.thread.mourn, 64), '尚未形成');
  const choice = state.thread.renew || state.thread.reframe || state.thread.accept || '';

/* ---------------- summary builders ---------------- */
function needText(s) {
  const text = String(s.need || '').trim();
  const tags = (s.needTags || []).join('、');
  return text || tags || '被看见';
}
function needPhrase(s) {
  const tags = (s.needTags || []).join('、');
  if (tags) return tags;
  const text = cleanEnd(s.need);
  if (!text) return '被看见';
  return text.length <= 14 ? text : `你写下的那句「${compact(text, 26)}」`;
}
function protectionText(s) {
  const text = String(s.protection || '').trim();
  const tags = (s.protections || []).join('、');
  return text || tags || '用那时的方式保护自己';
}
function buildSeeSummary() {
  const s = state.see;
  const event = cleanEnd(s.event);
  if (!event) return '';
  const emotions = s.emotions.length ? s.emotions.join('、') : '一种说不清的感受';
  const bodyRaw = s.body.join('、');
  const body = bodyRaw && !bodyRaw.startsWith('说不清') ? `；身体${bodyRaw}` : '';
  const needTags = s.needTags.join('、');
  const needTextValue = cleanEnd(s.need);
  let needLine = '';
  if (needTags && needTextValue) needLine = `我最需要的是${needTags}。它想说的是：${needTextValue}`;
  else if (needTags) needLine = `我最需要的是${needTags}。`;
  else if (needTextValue) {
    needLine = needTextValue.length <= 14 ? `我最需要的是${needTextValue}。` : `它想说的是：${needTextValue}`;
  }
  const ending = needLine && !/[。！？]$/.test(needLine) ? '。' : '';
  return `我看见：${event}。那一刻，我感到${emotions}${body}。${needLine}${ending}`.trim();
}
function buildTraceSummary() {
  const s = state.trace;
  const lines = [];
  if (cleanEnd(s.earliest)) lines.push(`它可能来自：${cleanEnd(s.age) ? cleanEnd(s.age) + '，' : ''}${cleanEnd(s.earliest)}`);
  if (cleanEnd(s.childNeed) || s.childNeedTags.length) lines.push(`那时的我需要：${cleanEnd(s.childNeed) || s.childNeedTags.join('、')}`);
  if (cleanEnd(s.protection) || s.protections.length) lines.push(`它曾经保护我：${cleanEnd(s.protection) || s.protections.join('、')}`);
  lines.push(`现在我可以：${cleanEnd(s.choice)}`);
  return lines.join('\n');
}
function buildMournSummary() {
  const s = state.mourn;
  const loss = cleanEnd(s.loss) || s.lossTags.join('、');
  const farewell = cleanEnd(s.farewell) || s.farewellTags.join('、');
  const keep = cleanEnd(s.keep);
  if (!loss && !farewell && !keep) return '';
  const lines = [];
  if (loss) lines.push(`我为「${loss}」难过。`);
  if (s.feelTags.length) lines.push(`那里有${s.feelTags.join("、")}，都可以在这里。`);
  if (farewell) lines.push(`我告别：${farewell}。`);
  if (keep) lines.push(`我带走：${keep}。`);
  return lines.join('\n');
}
function buildAcceptSummary() {
  const s = state.accept;
  const allow = cleanEnd(s.allow) || s.kindnessTags.join('、');
  const truth = cleanEnd(s.truth);
  const notGiveUp = cleanEnd(s.notGiveUp);
  if (!allow && !truth && !notGiveUp) return '';
  const lines = [];
  if (allow) lines.push(`我愿意先允许：${allow}。`);
  if (truth) lines.push(`我承认：${truth}。`);
  if (notGiveUp) lines.push(`但我仍然：${notGiveUp}。`);
  return lines.join('\n');
}
function buildReframeSummary() {
  const s = state.reframe;
  const thought = cleanEnd(s.thought);
  const facts = cleanEnd(s.facts);
  const newStory = cleanEnd(s.newStory) || cleanEnd(s.alternative);
  if (!thought && !newStory) return '';
  const lines = [];
  if (thought) lines.push(`旧故事：${thought}。`);
  if (facts) lines.push(`事实是：${facts}。`);
  if (newStory) lines.push(`我更愿意相信：${newStory}。`);
  return lines.join('\n');
}
function buildBloomSummary() {
  const s = state.bloom;
  const strengths = s.strengths.length ? s.strengths.join('、') : '一些还没有被命名的力量';
  const evidence = cleanEnd(s.evidence) || cleanEnd(s.moments);
  const action = cleanEnd(s.action);
  if (!s.strengths.length && !s.moments.trim() && !action) return '';
  const lines = [`我看见自己拥有：${strengths}。`];
  if (evidence) lines.push(`它们曾帮助我：${evidence}。`);
  if (cleanEnd(s.support)) lines.push(`可以陪我继续的是：${cleanEnd(s.support)}。`);
  if (action) lines.push(`今天，我愿意为自己：${action}。`);
  return lines.join('\n');
}
function buildRenewSummary() {
  const s = state.renew;
  const narrative = cleanEnd(s.narrative);
  if (!narrative) return '';
  const lines = [`${narrative}。`];
  if (cleanEnd(s.take)) lines.push(`我想带走：${cleanEnd(s.take)}。`);
  if (cleanEnd(s.leave)) lines.push(`我想放下：${cleanEnd(s.leave)}。`);
  if (cleanEnd(s.commitment)) lines.push(`从今以后，我愿意：${cleanEnd(s.commitment)}。`);
  if (s.anchors.length) lines.push(`我会记得：${s.anchors.join('、')}。`);
  return lines.join('\n');
}
function ensureSummary(stage) {
  const d = stageData(stage);
  if (d.summary && d.summary.trim()) return;
  const builders = {
    see: buildSeeSummary,
    trace: buildTraceSummary,
    mourn: buildMournSummary,
    accept: buildAcceptSummary,
    reframe: buildReframeSummary,
    bloom: buildBloomSummary,
    renew: buildRenewSummary
  };
  d.summary = (builders[stage] || buildSeeSummary)();
}

/* ---------------- validation & step flow ---------------- */
function validateStep(stage, step) {
  const d = stageData(stage);
  if (stage === 'see') {
    if (step === 0 && !d.event.trim()) return { ok: false, message: '先写下一个具体时刻，哪怕只有一句话。', focus: '#seeEvent' };
    if (step === 1 && !d.emotions.length && !d.body.length && !d.felt.trim()) return { ok: false, message: '选一个情绪或身体感受，或者写一句“最难受的部分”。', focus: null };
    if (step === 2 && !d.need.trim() && !d.needTags.length) return { ok: false, message: '给它一个需要：可以点选，也可以自己写。', focus: '#seeNeed' };
    if (step === 3 && !d.summary.trim()) return { ok: false, message: '还差一句“带走的话”。可以自己写，也可以让上一层的记录先替你组织。', focus: '#seeSummary' };
  } else if (stage === 'trace') {
    if (step === 0 && !d.earliest.trim()) return { ok: false, message: '写下一个画面或一句“说不清”，再继续。', focus: '#traceEarliest' };
    if (step === 1 && !d.childState.trim() && !d.childNeed.trim() && !d.childNeedTags.length) return { ok: false, message: '写一点那个更小的你，或者选一个 TA 需要的东西。', focus: '#traceChildState' };
    if (step === 2 && !d.protection.trim() && !d.protections.length && !d.cost.trim()) return { ok: false, message: '先写一点：它保护了你什么，或让你付出了什么。', focus: '#traceProtection' };
    if (step === 3 && !d.summary.trim()) return { ok: false, message: '来路卡还没有内容。可以先写“现在我可以……”这一行。', focus: '#traceSummary' };
  } else if (stage === 'mourn') {
    if (step === 0 && !d.loss.trim() && !d.lossTags.length) return { ok: false, message: '选一个靠近的，或写一句：那时你失去了什么。', focus: '#mournLoss' };
    if (step === 1 && !d.feelTags.length && !d.unsaid.trim()) return { ok: false, message: '选一个感受，或写一句没来得及说的话。', focus: '#mournUnsaid' };
    if (step === 2 && !d.farewell.trim() && !d.farewellTags.length && !d.keep.trim()) return { ok: false, message: '写一点：你愿意告别什么，或想留下什么。', focus: '#mournFarewell' };
    if (step === 3 && !d.summary.trim()) return { ok: false, message: '告别句还没有内容。可以先写“我为……难过”这一行。', focus: '#mournSummary' };
  } else if (stage === 'accept') {
    if (step === 0 && !d.resist.trim() && !d.resistanceTags.length) return { ok: false, message: '先写下或选一句：你正在推开什么。', focus: '#acceptResist' };
    if (step === 1 && !d.allow.trim() && !d.kindnessTags.length) return { ok: false, message: '先借一句温柔的话给自己，哪怕还不太相信。', focus: '#acceptAllow' };
    if (step === 2 && !d.truth.trim() && !d.notGiveUp.trim()) return { ok: false, message: '写一点：你承认什么，或你仍然不放弃什么。', focus: '#acceptTruth' };
    if (step === 3 && !d.summary.trim()) return { ok: false, message: '允许句还没有内容。可以先把上一层的记录收拢起来。', focus: '#acceptSummary' };
  } else if (stage === 'reframe') {
    if (step === 0 && !d.thought.trim()) return { ok: false, message: '先把卡住你的那句话原样写下来。', focus: '#reframeThought' };
    if (step === 1 && !d.facts.trim() && !d.interpretation.trim()) return { ok: false, message: '至少写一边：事实，或你当时的解释。', focus: '#reframeFacts' };
    if (step === 2 && !d.newStory.trim() && !d.alternative.trim()) return { ok: false, message: '先写一句：还有没有别的可能，或你更愿意相信什么。', focus: '#reframeNewStory' };
    if (step === 3 && !d.summary.trim()) return { ok: false, message: '新故事还没有内容。可以先写“我更愿意相信……”这一行。', focus: '#reframeSummary' };
  } else if (stage === 'bloom') {
    if (step === 0 && !d.strengths.length && !d.moments.trim()) return { ok: false, message: '先选一个你认得的自己，或写一个有生命力的瞬间。', focus: '#bloomMoments' };
    if (step === 1 && !d.evidence.trim() && !d.moments.trim()) return { ok: false, message: '举一个具体的例子，让这份资源落到地上。', focus: '#bloomEvidence' };
    if (step === 2 && !d.action.trim()) return { ok: false, message: '写一件很小、五分钟内能开始的事。', focus: '#bloomAction' };
    if (step === 3 && !d.summary.trim()) return { ok: false, message: '种子还没有内容。可以先写一件具体的行动。', focus: '#bloomSummary' };
  } else if (stage === 'renew') {
    if (step === 0 && !d.narrative.trim()) return { ok: false, message: '先写下新的开头，哪怕只有一句话。', focus: '#renewNarrative' };
    if (step === 1 && !d.take.trim() && !d.leave.trim()) return { ok: false, message: '写一点：你想带走什么，或想慢慢放下什么。', focus: '#renewTake' };
    if (step === 2 && !d.commitment.trim() && !d.anchors.length) return { ok: false, message: '写一句你愿意怎样对待自己，或选一个日常锚点。', focus: '#renewCommitment' };
    if (step === 3 && !d.summary.trim()) return { ok: false, message: '新叙事还没有内容。可以把前面的记录先收拢起来。', focus: '#renewSummary' };
  }
  return { ok: true };
}

function showStepError(result) {
  showToast(result.message, 3300);
  if (result.focus) {
    const field = $(result.focus);
    if (field) {
      field.focus({ preventScroll: false });
      field.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

function saveStep() {
  const stage = state.stage;
  const d = stageData(stage);
  const step = d.step;
  const check = validateStep(stage, step);
  if (!check.ok) { showStepError(check); return; }
  offerSafetyNotice(JSON.stringify(d));

  d.completed[step] = true;
  d.updatedAt = Date.now();
  if (step < 3) {
    d.step = step + 1;
    d.summary = '';
    ensureSummary(stage);
    if (d.done && d.summary.trim()) state.thread[stage] = d.summary;
    d.reflection = '';
    d.reflectionStep = step;
    d.reflectionLoading = true;
    d.reflectionError = '';
    saveNow();
    renderAll();
    scrollStageTop();
    runReflection(stage, step);
  }
}

function scrollStageTop() {
  const main = $('#stageMain');
  if (main) main.scrollTo({ top: 0, behavior: 'smooth' });
}

function goToStep(step) {
  const d = stageData();
  if (step < 0 || step > 3) return;
  if (step > d.step && !d.completed[step]) return;
  d.step = step;
  saveNow();
  renderStage();
  renderCompanion();
  scrollStageTop();
}

function switchStage(id) {
  if (!STAGE_META[id]) return;
  if (!isStageAvailable(id)) {
    const previous = PREV_STAGE[id];
    showToast(previous ? `先完成「${STAGE_META[previous].label}」的收束，再把内容带过来。` : '先完成上一幕。', 3200);
    return;
  }
  if (state.stage === id) return;
  if (reflectionController) reflectionController.abort();
  reflectionSeq += 1;
  state.stage = id;
  const d = state[id];
  if (!d.reflection) {
    d.reflection = stageIntro(id);
    d.reflectionStep = -1;
  }
  saveNow();
  renderAll();
  const main = $('#stageMain');
  if (main) main.scrollTop = 0;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------------- reflection / local fallback ---------------- */
function stageIntro(stage) {
  if (stage === 'see') return '我在这里。我们不急着分析，先把刚才那一刻放慢。你可以从写下那个具体画面开始。';
  const previous = PREV_STAGE[stage];
  const carry = previous && state.thread[previous]
    ? `你把「${compact(threadBody(state.thread[previous], STAGE_META[previous].label), 44)}」带到了这里。`
    : '';
  const bodies = {
    trace: '我们不急着找唯一的原因，只看看它最早在哪里出现。',
    mourn: '先不急着接纳。有些东西，值得先好好告别。可以慢慢写，也可以随时停下。',
    accept: '告别之后，先不急着改变。看看你还在和哪一部分的自己打架。',
    reframe: '允许之后，我们来看看那个旧故事，是否还有别的讲述方式。',
    bloom: '现在，看看你身上的光。它可能比你以为的更早就在那里。',
    renew: '把前六幕收拢成一条可以继续走的路，然后带回日常。'
  };
  return carry + (bodies[stage] || '慢一点，我们从此刻开始。');
}

function reflectionKicker(stage) {
  const d = stageData(stage);
  if (d.reflectionLoading) return '栖心正在整理';
  if (d.reflectionStep >= 0) return `关于第 ${d.reflectionStep + 1} 层 · ${DEPTH_LABELS[stage][d.reflectionStep]}`;
  const previous = PREV_STAGE[stage];
  return previous && state.thread[previous] ? `从${STAGE_META[previous].label}带来` : '此刻的注脚';
}

function renderCompanion() {
  const stage = state.stage;
  const d = stageData(stage);
  const status = $('#companionStatus');
  const kicker = $('#reflectionKicker');
  const text = $('#reflectionText');
  const sign = $('#reflectionSign');
  const error = $('#reflectionError');
  if (!text) return;

  if (status) {
    status.textContent = hasApiKey() ? `DeepSeek · ${state.settings.model}` : '本地注脚';
    status.classList.toggle('connected', hasApiKey());
  }
  if (kicker) kicker.textContent = reflectionKicker(stage);
  if (sign) sign.hidden = d.reflectionLoading;

  if (d.reflectionLoading) {
    text.className = 'reflection-text';
    text.innerHTML = '正在听你刚才写下的。<span class="typing-dots"><i></i><i></i><i></i></span>';
  } else if (d.reflection && d.reflection.trim()) {
    text.className = 'reflection-text';
    text.textContent = d.reflection;
  } else {
    text.className = 'reflection-text placeholder';
    text.textContent = stageIntro(stage);
  }

  if (error) {
    error.hidden = !d.reflectionError;
    error.textContent = d.reflectionError || '';
  }
}

function updateReflectionLive(value) {
  const text = $('#reflectionText');
  if (!text) return;
  text.className = 'reflection-text';
  text.textContent = value;
}

function localReflection(stage, step) {
  if (stage === 'see') {
    const d = state.see;
    if (step === 0) {
      return `你写下的不是一个抽象的问题，而是一个具体的时刻：${cleanEnd(compact(d.event, 38))}。先不急着解释它为什么发生。让这个画面在这里停一会儿，它已经足够说明，你当时并不轻松。`;
    }
    if (step === 1) {
      const body = d.body.length ? d.body.join('、') : '身体还在沉默';
      const emotions = d.emotions.length ? d.emotions.join('、') : '一种说不清的情绪';
      return `你认出了${emotions}，身体也在说：${body}。这些反应不是矫情，也不是需要立刻修正的错误。它们更像是身体在替你守着一个很重要的东西。`;
    }
    if (step === 2) {
      return `你需要的，可能不是别人立刻改变，而是${needPhrase(d)}。这句话越具体，越不容易被自己忽略。它不是要求，而是一个可以慢慢靠近的方向。`;
    }
    return `你已经把这一刻放进了语言里。接下来只带走一句最诚实的话，不带走全部解释。剩下那些还没有说清的，可以留在下一幕继续。`;
  }

  if (stage === 'trace') {
    const d = state.trace;
    if (step === 0) {
      const where = cleanEnd(d.age) || '某个尚未命名的时刻';
      return `你从「${compact(threadBody(state.thread.see, '我看见'), 30)}」出发，回到了${where}。这不是在翻旧账，而是在给那段经历一个可以被理解的位置。`;
    }
    if (step === 1) {
      const child = d.childState.trim() ? cleanEnd(compact(d.childState, 48)) : '在用 TA 当时会的方式撑住自己';
      return `那个更小的你，当时${child}。TA 需要的，可能不是完美，而是${cleanEnd(d.childNeed || d.childNeedTags.join('、')) || '有人站在 TA 那边'}。这句话不是迟到的补偿，而是现在的你，终于看见了 TA。`;
    }
    if (step === 2) {
      return `这个方式曾经${cleanEnd(protectionText(d))}，也让你${cleanEnd(compact(d.cost, 46)) || '付出了一些说不清的代价'}。看见它，不等于责怪它。它只是曾经尽力保护过你，而现在，你可以慢慢选择不同的方式。`;
    }
    return `这条来路不是判决书，而是一张地图。它告诉你，你从哪里来，也提醒你：现在的你，已经可以为自己做一点不同的选择。`;
  }

  if (stage === 'mourn') {
    const d = state.mourn;
    if (step === 0) {
      return `你写下失去的是「${cleanEnd(compact(d.loss, 36)) || d.lossTags.join('、') || '一些说不清的东西'}」。它不需要被证明有多严重，才有资格被认真对待。`;
    }

      return `${d.feelTags.length ? '你感到' + d.feelTags.join('、') + '。' : ''}这些感受不是要被处理掉的问题，它们是在告诉你：那里曾经很重要。可以先让它们在这里。`;
    }

      return `你愿意告别「${cleanEnd(compact(d.farewell, 34)) || d.farewellTags.join('、') || '一部分不再需要背着的东西'}」，也留下了「${cleanEnd(compact(d.keep, 30)) || '值得留下的'}」。告别不是忘记，是让它回到过去该在的位置。`;
    }
    return `这句告别不需要让你释然。失去是真的，难过也是真的。你带走的，会陪你去看看：现在，还剩下哪一部分你仍然推开。`;
  }

  if (stage === 'accept') {

    if (step === 0) {
      const resistance = cleanEnd(d.resist) || d.resistanceTags.join('、') || '一个还不愿意被看见的部分';
      return `你写下的「${compact(resistance, 34)}」，不是脾气，也不是脆弱。它更像一个还在努力保护你的部分。先不急着把它赶走，先让它被看见。`;

  if (stage === 'reframe') {
    const d = state.reframe;
    if (step === 0) {
      return `你卡住的那句话是「${cleanEnd(compact(d.thought, 38))}」。先把它当作一个故事，而不是一条事实。故事可以被重新讲述。`;

  if (stage === 'bloom') {

    }
    if (step === 2) {

    }

  }

  const d = state.renew;
  if (step === 0) {
    return `你写下新的开头：「${cleanEnd(compact(d.narrative, 44))}」。它不是抹掉过去，而是给过去一个位置，同时给现在的你一个方向。`;

    return `你愿意「${cleanEnd(compact(d.commitment, 44)) || '对自己温柔一点'}」。这不是口号，是以后可以回来的方向。`;
  }
  return `七幕走到这里。你带走的不只是一个答案，而是一条可以继续走的路。反复的时候，记得回来。`;
}

    if (step === 2) record = `具体时刻：${d.event}\n情绪：${d.emotions.join('、')}\n身体：${d.body.join('、')}\n需要标签：${d.needTags.join('、') || '未选'}\n它想说的话：${d.need || '未写'}`;

    if (step === 1) record = `仍在抗拒：${d.resist || d.resistanceTags.join('、') || '未写'}\n愿意对自己说：${d.allow || d.kindnessTags.join('、') || '未写'}`;
    if (step === 2) record = `我承认：${d.truth || '未写'}\n但我仍然：${d.notGiveUp || '未写'}`;

    user: `请根据以下记录写注脚。\n\n${record || '用户还没有写下内容，只写一句安静的陪伴。'}`

async function streamCompletion(messages, onDelta, signal, maxTokens = 320) {
  const key = getApiKey();
  if (!key) throw new Error('NO_KEY');
  const model = state.settings.model || 'deepseek-chat';
  const body = {
    model,
    messages,
    stream: true,
    max_tokens: model === 'deepseek-reasoner' ? Math.max(900, maxTokens) : maxTokens
  };
  if (model !== 'deepseek-reasoner') body.temperature = Number(state.settings.temperature) || 0.8;
  let response;
  try {
    response = await fetch(endpointFrom(), {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`,
        'Accept': 'text/event-stream'
      },
      body: JSON.stringify(body),
      signal
    });
  } catch (err) {
    if (err.name === 'AbortError') throw err;
    const error = new Error('NETWORK');
    error.cause = err;
    throw error;
  }
  if (!response.ok) {
    let detail = '';
    try {
      const data = await response.json();
      detail = data.error && (data.error.message || data.error.type) ? (data.error.message || data.error.type) : '';
    } catch (_) { /* ignore */ }
    const error = new Error(detail || `HTTP ${response.status}`);
    error.status = response.status;
    throw error;
  }
  if (!response.body) {
    const data = await response.json();
    const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (content) onDelta(content);
    return;
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buffer = '';
  let done = false;
  while (!done) {
    const chunk = await reader.read();
    if (chunk.done) break;
    buffer += decoder.decode(chunk.value, { stream: true });
    let match;
    while ((match = buffer.match(/\r?\n\r?\n/))) {
      const block = buffer.slice(0, match.index);
      buffer = buffer.slice(match.index + match[0].length);
      for (const line of block.split(/\r?\n/)) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const data = trimmed.slice(5).trim();
        if (!data || data === '[DONE]') { done = true; continue; }
        try {
          const json = JSON.parse(data);
          const delta = json.choices && json.choices[0]
            ? (json.choices[0].delta && json.choices[0].delta.content) || ''
            : '';
          if (delta) onDelta(delta);
        } catch (_) { /* keep */ }
      }
    }
  }
}

async function runReflection(stage, step) {
  const seq = ++reflectionSeq;
  if (reflectionController) reflectionController.abort();
  const controller = new AbortController();
  reflectionController = controller;
  const d = state[stage];
  const local = localReflection(stage, step);

  if (!hasApiKey()) {
    await new Promise(resolve => setTimeout(resolve, 420));
    if (seq !== reflectionSeq) return;
    d.reflection = local;
    d.reflectionLoading = false;
    d.reflectionStep = step;
    d.reflectionError = '';
    saveNow();
    if (reflectionController === controller) reflectionController = null;
    if (state.stage === stage) renderCompanion();
    return;
  }

  const prompt = reflectionPrompt(stage, step);
  let received = false;
  try {
    await streamCompletion(
      [{ role: 'system', content: prompt.system }, { role: 'user', content: prompt.user }],
      delta => {
        if (seq !== reflectionSeq) return;
        if (!received) {
          received = true;
          d.reflectionLoading = false;
          if (state.stage === stage) {
            const sign = $('#reflectionSign');
            if (sign) sign.hidden = false;
          }
        }
        d.reflection += delta;
        if (state.stage === stage) updateReflectionLive(d.reflection);
      },
      controller.signal,
      320
    );
    if (seq !== reflectionSeq) return;
    if (!received) throw new Error('EMPTY');
    d.reflectionLoading = false;
    d.reflectionStep = step;
    d.reflectionError = '';
    saveNow();
    if (state.stage === stage) renderCompanion();
  } catch (err) {
    if (err.name === 'AbortError' || seq !== reflectionSeq) return;
    d.reflection = local;
    d.reflectionLoading = false;
    d.reflectionStep = step;
    d.reflectionError = friendlyApiError(err, true);
    saveNow();
    if (state.stage === stage) renderCompanion();
  } finally {
    if (reflectionController === controller) reflectionController = null;
  }
}

function friendlyApiError(err, short = false) {
  if (!err) return '连接没有成功。';
  if (err.message === 'NO_KEY') return '还没有连接 DeepSeek，已使用本地注脚。';
  if (err.message === 'EMPTY') return '这次没有收到完整回应，已使用本地注脚。';
  if (err.message === 'NETWORK' || err instanceof TypeError) return '浏览器没能连上 DeepSeek，已使用本地注脚。可以在设置里测试连接。';
  if (err.status === 401) return 'API Key 无效或已失效（401），已使用本地注脚。';
  if (err.status === 402) return '账户余额不足（402），已使用本地注脚。';
  if (err.status === 429) return '请求有点频繁（429），已使用本地注脚，稍后再试。';
  if (err.status >= 500) return `DeepSeek 服务暂时不稳定（${err.status}），已使用本地注脚。`;
  return short ? '连接未成功，已使用本地注脚。' : `连接未成功：${err.message || '未知错误'}`;
}
function connectionErrorText(err) {
  if (!err) return '连接没有成功。';
  if (err.message === 'NETWORK' || err instanceof TypeError) return '浏览器没能连上接口。请检查网络、接口地址和 Key 是否完整。';
  if (err.status === 401) return 'API Key 无效或已失效（401）。';
  if (err.status === 402) return '账户余额不足（402）。';
  if (err.status === 404) return '接口地址不存在（404）。';
  if (err.status === 429) return '请求有点频繁（429），稍后再试。';
  if (err.status >= 500) return `服务暂时不稳定（${err.status}）。`;
  return `连接未成功：${err.message || '未知错误'}`;
}

/* ---------------- finish & handoff ---------------- */
function finishStage() {
  const stage = state.stage;
  const d = stageData(stage);
  const check = validateStep(stage, 3);
  if (!check.ok) { showStepError(check); return; }
  offerSafetyNotice(d.summary);
  d.summary = d.summary.trim();
  d.done = true;
  d.completed[3] = true;
  d.updatedAt = Date.now();
  state.thread[stage] = d.summary;
  if (stage === 'renew') state.meta.completedAt = Date.now();
  saveNow();
  renderAll();
  if (stage === 'renew') openCompletion();
  else openHandoff(stage);
}

function openHandoff(stage) {
  const index = STAGE_ORDER.indexOf(stage);
  const next = STAGE_ORDER[index + 1];
  if (!next) { openCompletion(); return; }
  const nextLabel = STAGE_META[next].label;
  const quote = state.thread[stage];
  const layer = openModal(`
    <div class="modal handoff-modal" role="dialog" aria-modal="true" aria-label="带着这一句去${escAttr(nextLabel)}">
      <div class="handoff-card">
        <div class="handoff-mark">线</div>
        <div class="modal-kicker">你带走了一句话</div>
        <h2>现在，<em>带着它去${esc(nextLabel)}。</em></h2>
        <div class="handoff-quote">${esc(quote)}</div>
        <p>下一幕不会再从空白开始。它会把这句话放在最上面，作为第一层的起点。</p>
        <div class="handoff-actions">
          <button class="primary-btn" type="button" id="handoffGo">带着它去${esc(nextLabel)}
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
          </button>
          <button class="secondary-btn" type="button" id="handoffStay">再留一会儿</button>
        </div>
      </div>
    </div>`, { focus: '#handoffGo' });
  layer.querySelector('#handoffGo').addEventListener('click', () => {
    closeModal(layer);
    setTimeout(() => switchStage(next), 170);
  });
  layer.querySelector('#handoffStay').addEventListener('click', () => closeModal(layer));
}
