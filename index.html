/* ---------------- AI polish ---------------- */
async function callCompletionText(messages, maxTokens = 260) {
  const key = getApiKey();
  if (!key) throw new Error('NO_KEY');
  const model = state.settings.model || 'deepseek-chat';
  const body = {
    model,
    messages,
    stream: false,
    max_tokens: model === 'deepseek-reasoner' ? Math.max(700, maxTokens) : maxTokens
  };
  if (model !== 'deepseek-reasoner') body.temperature = 0.55;
  let response;
  try {
    response = await fetch(endpointFrom(), {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`
      },
      body: JSON.stringify(body)
    });
  } catch (err) {
    const error = new Error('NETWORK');
    error.cause = err;
    throw error;
  }
  if (!response.ok) {
    let detail = '';
    try {
      const data = await response.json();
      detail = data.error && (data.error.message || data.error.type) ? (data.error.message || data.error.type) : '';
    } catch (_) { /* ignore */ }
    const error = new Error(detail || `HTTP ${response.status}`);
    error.status = response.status;
    throw error;
  }
  const data = await response.json();
  const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  if (!content) throw new Error('EMPTY');
  return String(content).trim().replace(/^["“]|["”]$/g, '');
}

async function polishCurrentSummary() {
  if (polishBusy) return;
  const stage = state.stage;
  const d = stageData(stage);
  if (!d.summary.trim()) {
    showToast('先留下一点内容，再让栖心润色。');
    return;
  }
  if (!hasApiKey()) {
    showToast('连接 DeepSeek 后，可以让栖心帮你润色；现在这句话已经可以继续。', 3200);
    return;
  }
  const button = $('[data-action="polish"]');
  const oldText = button ? button.textContent : '';
  polishBusy = true;
  if (button) { button.disabled = true; button.textContent = '栖心正在整理…'; }
  const isSee = stage === 'see';
  const safety = ' 如果文本中出现自伤、自杀、他伤或现实危险内容，不要润色，只输出原文。';
  const system = (isSee
    ? '你是栖心的文字编辑。请把下面这句话润色成第一人称、温柔、具体、保留事实、不添加新信息、不超过80字的句子。不要提问，不要解释，不要引号。只输出润色后的那一句话。'
    : '你是栖心的文字编辑。请润色下面这段自我探索记录，保留原有的换行与每行前缀，保留第一人称、事实与语气，不添加新信息，不解释，不提问。只输出润色后的文字。') + safety;
  const summaryIds = {
    see: '#seeSummary', trace: '#traceSummary', mourn: '#mournSummary', accept: '#acceptSummary',
    reframe: '#reframeSummary', bloom: '#bloomSummary', renew: '#renewSummary'
  };
  try {
    const result = await callCompletionText([
      { role: 'system', content: system },
      { role: 'user', content: d.summary }
    ], isSee ? 180 : 380);
    d.summary = result;
    saveNow();
    const textarea = $(summaryIds[stage]);
    if (textarea) textarea.value = result;
    showToast('已经润色好了，你可以继续修改。');
  } catch (err) {
    showToast(connectionErrorText(err), 3500);
  } finally {
    polishBusy = false;
    if (button) { button.disabled = false; button.textContent = oldText; }
  }
}

/* ---------------- stage input handlers ---------------- */
function handleStageClick(event) {
  const chip = event.target.closest('[data-chip]');
  if (chip) {
    const group = chip.dataset.chip;
    const value = chip.dataset.value;
    const arr = getPath(state, group);
    if (!Array.isArray(arr)) return;
    const index = arr.indexOf(value);
    if (index >= 0) arr.splice(index, 1);
    else arr.push(value);
    chip.classList.toggle('selected', index < 0);
    saveSoon();
    return;
  }

  const append = event.target.closest('[data-append]');
  if (append) {
    const path = append.dataset.append;
    const field = $(`[data-bind="${path}"]`);
    if (field) {
      const text = append.dataset.text || '';
      const start = typeof field.selectionStart === 'number' ? field.selectionStart : field.value.length;
      const end = typeof field.selectionEnd === 'number' ? field.selectionEnd : field.value.length;
      const before = field.value.slice(0, start);
      const after = field.value.slice(end);
      const prefix = before && !before.endsWith('\n') ? '\n' : '';
      field.value = before + prefix + text + after;
      const pos = (before + prefix + text).length;
      field.setSelectionRange(pos, pos);
      field.focus();
      setPath(state, path, field.value);
      saveSoon();
    }
    return;
  }

  const depth = event.target.closest('[data-depth]');
  if (depth) {
    goToStep(Number(depth.dataset.depth));
    return;
  }

  const actionEl = event.target.closest('[data-action]');
  if (!actionEl) return;
  const action = actionEl.dataset.action;
  if (action === 'save-step') { saveStep(); return; }
  if (action === 'prev-step') { goToStep(stageData().step - 1); return; }
  if (action === 'finish') { finishStage(); return; }
  if (action === 'back-stage') {
    const target = actionEl.dataset.stage;
    if (target) switchStage(target);
    return;
  }
  if (action === 'open-thread') {
    toggleThreadPanel(true);
    const panel = $('#threadPanel');
    if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return;
  }
  if (action === 'polish') { polishCurrentSummary(); return; }
  if (action === 'open-case') { openCase(); return; }
}

function handleStageInput(event) {
  const field = event.target.closest('[data-bind]');
  if (field) {
    const path = field.dataset.bind;
    const cleanPath = path.startsWith('state.') ? path.slice(6) : path;
    setPath(state, cleanPath, field.value);
    if (cleanPath === `${state.stage}.summary` && state[state.stage].done) {
      state.thread[state.stage] = field.value;
      renderThread();
    }
    saveSoon();
    return;
  }
  const range = event.target.closest('[data-range]');
  if (range) {
    const value = Number(range.value);
    setPath(state, range.dataset.range, value);
    range.style.setProperty('--val', `${value * 10}%`);
    const label = $('#intensityValue');
    if (label) label.textContent = value;
    saveSoon();
  }
}

function openModal(html, options = {}) {
  $$('.modal-layer').forEach(layer => layer.remove());
  const layer = document.createElement('div');
  layer.className = 'modal-layer';
  layer.innerHTML = html;
  document.body.appendChild(layer);
  document.body.style.overflow = 'hidden';
  layer.addEventListener('click', event => {
    if (event.target === layer) closeModal(layer);
    if (event.target.closest('[data-close]')) closeModal(layer);
  });
  requestAnimationFrame(() => {
    const target = options.focus ? layer.querySelector(options.focus) : layer.querySelector('input, textarea, button');
    if (target) target.focus({ preventScroll: true });
  });
  return layer;
}

function closeModal(layer) {
  if (!layer || !layer.parentNode) return;
  layer.style.animation = 'fadeIn .18s ease reverse both';
  const modal = layer.querySelector('.modal');
  if (modal) modal.style.animation = 'modalUp .18s ease reverse both';
  setTimeout(() => {
    layer.remove();
    if (!$('.modal-layer')) document.body.style.overflow = '';
  }, 160);
}

    keyInput.type = visible ? 'password' : 'text';
    $('#keyToggle', layer).textContent = visible ? '显示' : '隐藏';
  });
  $('#saveSettingsBtn', layer).addEventListener('click', () => {
    storeApiKey(keyInput.value, rememberInput.checked);
    state.settings.model = modelSelect.value;
    state.settings.temperature = Number(tempInput.value) || 0.8;
    saveNow();
    renderCompanion();
    renderStage();
    closeModal(layer);
    showToast(keyInput.value.trim() ? '设置已保存，栖心可以写注脚了。' : '设置已保存，当前使用本地注脚。');
  });
  $('#clearKeyBtn', layer).addEventListener('click', () => {
    clearStoredApiKeys();
    keyInput.value = '';
    setStatus('ok', '浏览器中保存的 Key 已清除。');
    renderCompanion();
    showToast('已清除浏览器中的 API Key；如曾泄露，请到 DeepSeek 控制台撤销。', 4200);
  });
  $('#testConnectionBtn', layer).addEventListener('click', async () => {
    const key = keyInput.value.trim();
    if (!key) { setStatus('err', '请先填写 API Key。'); keyInput.focus(); return; }
    setStatus('loading', '正在连接 DeepSeek…');
    const button = $('#testConnectionBtn', layer);
    button.disabled = true;
    try {
      await testApiConnection(key, modelSelect.value);
      setStatus('ok', '连接成功。');
      showToast('连接成功。');
    } catch (err) {
      setStatus('err', connectionErrorText(err));
    } finally {
      button.disabled = false;
    }
  });
  $('#exportJsonBtn', layer).addEventListener('click', exportJSON);
  $('#exportMdBtn', layer).addEventListener('click', exportMarkdown);
  $('#supportBtn2', layer).addEventListener('click', () => {
    closeModal(layer);
    setTimeout(openSupport, 170);
  });
  let resetArmed = false;
  let resetTimer = null;
  const resetBtn = $('#resetBtn', layer);
  resetBtn.addEventListener('click', () => {
    if (!resetArmed) {
      resetArmed = true;
      resetBtn.textContent = '再点一次，确认清空';
      resetTimer = setTimeout(() => { resetArmed = false; resetBtn.textContent = '重新开始这次'; }, 4000);
      return;
    }
    clearTimeout(resetTimer);
    if (reflectionController) reflectionController.abort();
    reflectionSeq += 1;
    const settings = clone(state.settings);
    state = makeState();
    state.settings = settings;
    saveNow();
    closeModal(layer);
    renderAll();
    showToast('这一次已经清空，可以重新开始。');
  });
}

/* ---------------- export ---------------- */
function downloadBlob(content, filename, type = 'text/plain;charset=utf-8') {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/* ---------------- safety ---------------- */
function detectRisk(text) {
  return /(自杀|自伤|不想活|活不下去|想死|结束生命|伤害自己|轻生|割腕|跳楼|活着没意思)/i.test(String(text || ''));
}
function offerSafetyNotice(text) {
  if (!detectRisk(text)) return;
  showToast('如果你此刻有伤害自己的念头，请先点右上角的支持按钮，或联系 120 / 110 / 12356。你不需要一个人扛。', 5200);
}

/* ---------------- toast ---------------- */
function showToast(message, duration = 2600) {
  const root = $('#toastRoot');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = message;
  root.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('out');
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

/* ---------------- render all / boot ---------------- */
function renderAll() {
  renderNav();
  renderThread();
  renderStage();
  renderCompanion();
}

function bindEvents() {
  $('#journeyNav').addEventListener('click', event => {
    const button = event.target.closest('[data-stage]');
    if (!button) return;
    const id = button.dataset.stage;
    if (!STAGE_META[id]) return;
    switchStage(id);
  });

  const main = $('#stageMain');
  main.addEventListener('click', handleStageClick);
  main.addEventListener('input', handleStageInput);

  $('#threadToggle').addEventListener('click', () => toggleThreadPanel());
  $('#threadTopBtn').addEventListener('click', openThreadPanel);
  $('#supportBtn').addEventListener('click', openSupport);
  $('#settingsBtn').addEventListener('click', openSettings);
  $('#settingsBtnTop').addEventListener('click', openSettings);

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      const layers = $$('.modal-layer');
      const top = layers[layers.length - 1];
      if (top) closeModal(top);
    }
  });
  window.addEventListener('beforeunload', saveNow);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') saveNow();
  });
}

function init() {
  state = loadState();
  if (state.settings && Object.prototype.hasOwnProperty.call(state.settings, 'baseUrl')) {
    delete state.settings.baseUrl;
  }
  if (!STAGE_META[state.stage]) state.stage = 'see';
  STAGE_ORDER.forEach(stage => {
    if (!state[stage] || typeof state[stage] !== 'object') state[stage] = makeState()[stage];
    const d = state[stage];
    if (d.step < 0 || d.step > 3) d.step = 0;
    if (!Array.isArray(d.completed) || d.completed.length !== 4) d.completed = [false, false, false, false];
  });
  if (!isStageAvailable(state.stage)) {
    state.stage = STAGE_ORDER.find(id => isStageAvailable(id) && !state[id].done) || 'see';
  }
  renderDate();
  renderAll();
  bindEvents();
  showConsentIfNeeded();
}

init();
