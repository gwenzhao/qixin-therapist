  p{margin:0;color:#6f7c74;font-size:12px;line-height:1.9}
  a{display:inline-block;margin-top:22px;padding:9px 16px;border-radius:999px;background:#1b2a23;color:#f8f2e6;font-size:11px;text-decoration:none}

</head>
